# WirePlumber: leave the Sennheiser BTD 700 dongle alone. On a machine that runs both a PipeWire sink (built-in
# Bluetooth) and a dongle sink (ALSA directly), PipeWire would otherwise open the dongle as a sound card of its own,
# make it the default output or hold it busy, and the dongle sink would get "device busy".
#   install -D -m 644 wireplumber-no-btd700.conf ~/.config/wireplumber/wireplumber.conf.d/52-no-btd700.conf
#   systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    matches = [
      { device.vendor.id = "0x3542", device.product.id = "0x3001" }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]
